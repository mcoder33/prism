# GoReleaser builds prebuilt prism binaries on each v* tag.
# Run `goreleaser check` to validate, `goreleaser release --snapshot --clean` to dry-run.
version: 2

project_name: prism

before:
  hooks:
    - go mod tidy

builds:
  - id: prism
    main: .
    binary: prism
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w

archives:
  - id: prism
    # name_template must stay in sync with install.sh's asset name.
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

release:
  github:
    owner: mcoder33
    name: prism

